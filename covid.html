<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dati COVID-19 Italia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #004080; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>Andamento Nazionale COVID-19</h1>
    <p>Dati estratti tramite XMLHttpRequest e organizzati per data.</p>
    
    <!-- Tabella in cui verranno inseriti i dati -->
    <table id="tabella-covid">
        <thead>
            <tr>
                <th>Data</th>
                <th>Nuovi Positivi</th>
                <th>Totale Positivi</th>
                <th>Dimessi / Guariti</th>
                <th>Deceduti</th>
                <th>Totale Casi</th>
            </tr>
        </thead>
        <tbody id="corpo-tabella">
            <!-- Le righe della tabella verranno generate dal codice JS -->
        </tbody>
    </table>

    <script>
        // 1. Creazione dell'oggetto XHR
        const xhr = new XMLHttpRequest(); //[cite: 9]

        // 2. Preparazione della richiesta verso il server remoto
        const url = "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json";
        xhr.open("GET", url, true); //[cite: 8, 9]

        // 3. Gestione della risposta dal server
        xhr.onload = function() {
            // Controlliamo che la richiesta sia riuscita (codice HTTP 200)
            if (xhr.status === 200) { //[cite: 6, 8]
                
                // 4. Conversione della risposta JSON da stringa a oggetto JavaScript
                const dati = JSON.parse(xhr.responseText); //[cite: 7, 8, 9, 13]
                
                let righeTabella = "";

                // Iteriamo l'array multidimensionale JSON 
                // per creare una riga di tabella per ogni giorno registrato
                for(let i = 0; i < dati.length; i++) {
                    let giorno = dati[i];
                    
                    // Formattazione per visualizzare la data senza il timestamp dell'orario
                    let dataPulita = giorno.data.split("T")[0];

                    righeTabella += `
                        <tr>
                            <td>${dataPulita}</td>
                            <td>${giorno.nuovi_positivi || 0}</td>
                            <td>${giorno.totale_positivi || 0}</td>
                            <td>${giorno.dimessi_guariti || 0}</td>
                            <td>${giorno.deceduti || 0}</td>
                            <td>${giorno.totale_casi || 0}</td>
                        </tr>
                    `;
                }

                // Inseriamo l'HTML generato dentro il corpo della tabella nel DOM
                document.getElementById("corpo-tabella").innerHTML = righeTabella; //[cite: 9]
                
            } else {
                // In caso di problemi stampiamo un avviso
                document.getElementById("corpo-tabella").innerHTML = "<tr><td colspan='6'>Errore nel caricamento dei dati.</td></tr>"; //[cite: 8]
            }
        };

        // Gestione di un eventuale errore nella richiesta
        xhr.onerror = function() {
            document.getElementById("corpo-tabella").innerHTML = "<tr><td colspan='6'>Errore di rete nella richiesta.</td></tr>"; //[cite: 8]
        };

        // 5. Invio effettivo della richiesta preparata
        xhr.send(); //[cite: 8, 13]
    </script>
</body>
</html>
