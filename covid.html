<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Andamento nazionale COVID-19</title>
<style>
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
th, td {
  padding: 4px 8px;
  text-align: right;
}
th {
  background-color: #dddddd;
}
</style>
</head>
<body>

<h1>Andamento nazionale COVID-19 (dati per data)</h1>
<p id="demo">Caricamento...</p>

<script>
var xmlhttp = new XMLHttpRequest();

xmlhttp.onreadystatechange = function() {
  if (this.readyState == 4 && this.status == 200) {
    var myObj = JSON.parse(this.responseText);
    var txt = "";
    var i;

    txt += "<table>";
    txt += "<tr>";
    txt += "<th>Data</th>";
    txt += "<th>Ricoverati con sintomi</th>";
    txt += "<th>Terapia intensiva</th>";
    txt += "<th>Totale ospedalizzati</th>";
    txt += "<th>Isolamento domiciliare</th>";
    txt += "<th>Totale positivi</th>";
    txt += "<th>Variazione totale positivi</th>";
    txt += "<th>Nuovi positivi</th>";
    txt += "<th>Dimessi guariti</th>";
    txt += "<th>Deceduti</th>";
    txt += "<th>Totale casi</th>";
    txt += "<th>Tamponi</th>";
    txt += "</tr>";

    for (i = 0; i < myObj.length; i++) {
      txt += "<tr>";
      txt += "<td>" + myObj[i].data.substring(0, 10) + "</td>";
      txt += "<td>" + myObj[i].ricoverati_con_sintomi + "</td>";
      txt += "<td>" + myObj[i].terapia_intensiva + "</td>";
      txt += "<td>" + myObj[i].totale_ospedalizzati + "</td>";
      txt += "<td>" + myObj[i].isolamento_domiciliare + "</td>";
      txt += "<td>" + myObj[i].totale_positivi + "</td>";
      txt += "<td>" + myObj[i].variazione_totale_positivi + "</td>";
      txt += "<td>" + myObj[i].nuovi_positivi + "</td>";
      txt += "<td>" + myObj[i].dimessi_guariti + "</td>";
      txt += "<td>" + myObj[i].deceduti + "</td>";
      txt += "<td>" + myObj[i].totale_casi + "</td>";
      txt += "<td>" + myObj[i].tamponi + "</td>";
      txt += "</tr>";
    }

    txt += "</table>";
    document.getElementById("demo").innerHTML = txt;
  } else if (this.readyState == 4) {
    document.getElementById("demo").textContent = "Errore nel caricamento. Status: " + this.status;
  }
};

xmlhttp.onerror = function() {
  document.getElementById("demo").textContent = "Errore nella richiesta (rete bloccata o problema di accesso al file).";
};

xmlhttp.open("GET", "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json", true);
xmlhttp.send();
</script>

</body>
</html>
