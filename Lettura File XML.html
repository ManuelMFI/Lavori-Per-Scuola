<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica Classe</title>
</head>
<body>

    <h1>Anagrafica della Classe</h1>
    <div id="risultato"></div>

    <script>
        // Creazione dell'oggetto XMLHttpRequest per richiedere i dati al server
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "classe.xml", true);

        // Gestione della risposta al caricamento
        xhr.onload = function() {
            if (xhr.status === 200) { // Verifica che la richiesta sia andata a buon fine
                const xmlDoc = xhr.responseXML;
                const studenti = xmlDoc.getElementsByTagName("studente");
                
                // Inizio della tabella HTML
                let tabella = "<table border='1'><tr><th>Nome</th><th>Cognome</th><th>Età</th></tr>";
                
                // Lettura dei nodi XML
                for (let i = 0; i < studenti.length; i++) {
                    let nome = studenti[i].getElementsByTagName("nome")[0].textContent;
                    let cognome = studenti[i].getElementsByTagName("cognome")[0].textContent;
                    let eta = studenti[i].getElementsByTagName("eta")[0].textContent;
                    
                    tabella += "<tr><td>" + nome + "</td><td>" + cognome + "</td><td>" + eta + "</td></tr>";
                }
                
                tabella += "</table>";
                
                // Inserimento dinamico della tabella nell'HTML[cite: 1]
                document.getElementById("risultato").innerHTML = tabella;
            } else {
                document.getElementById("risultato").textContent = "Errore nel caricamento.";[cite: 1]
            }
        };

        // Invio della richiesta[cite: 1]
        xhr.send();
    </script>

</body>
</html>
