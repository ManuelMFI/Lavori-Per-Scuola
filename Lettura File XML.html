
<!DOCTYPE html>
<html>
<head>
    <title>Anagrafica classe</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Anagrafica della classe 5AINF</h1>

    <table id="tabella">

        <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Età</th>
            <th>Classe</th>
        </tr>

    </table>

    <script>

        // Creo una nuova richiesta
        let xhttp = new XMLHttpRequest();

        // Controllo quando la richiesta è completata
        xhttp.onreadystatechange = function() {

            if (this.readyState == 4 && this.status == 200) {

                // Recupero il documento XML
                let xmlDoc = this.responseXML;

                // Recupero tutti gli studenti
                let studenti = xmlDoc.getElementsByTagName("studente");

                // Recupero la tabella HTML
                let tabella = document.getElementById("tabella");

                // Scorro tutti gli studenti
                for (let i = 0; i < studenti.length; i++) {

                    // Leggo i dati dello studente
                    let nome = studenti[i].getElementsByTagName("nome")[0].childNodes[0].nodeValue;

                    let cognome = studenti[i].getElementsByTagName("cognome")[0].childNodes[0].nodeValue;

                    let eta = studenti[i].getElementsByTagName("eta")[0].childNodes[0].nodeValue;

                    let classe = studenti[i].getElementsByTagName("classe")[0].childNodes[0].nodeValue;

                    // Creo una nuova riga
                    let riga = tabella.insertRow();

                    // Inserisco le celle
                    riga.insertCell(0).textContent = nome;
                    riga.insertCell(1).textContent = cognome;
                    riga.insertCell(2).textContent = eta;
                    riga.insertCell(3).textContent = classe;

                }

            }

        };

        // Apro la richiesta per leggere il file XML
        xhttp.open("GET", "classe.xml", true);

        // Invio la richiesta
        xhttp.send();

    </script>

</body>
</html>
