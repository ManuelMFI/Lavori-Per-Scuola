<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica Classe</title>
</head>
<body>

    <h1>Anagrafica della Classe</h1>
    <div id="risultato"></div>

    <script>
        // Stringa XML contenuta direttamente nello script
        const xmlText = `<?xml version="1.0" encoding="UTF-8"?>
        <classe>
            <studente>
                <nome>Mario</nome>
                <cognome>Rossi</cognome>
                <eta>18</eta>
            </studente>
            <studente>
                <nome>Luigi</nome>
                <cognome>Verdi</cognome>
                <eta>19</eta>
            </studente>
            <studente>
                <nome>Anna</nome>
                <cognome>Bianchi</cognome>
                <eta>18</eta>
            </studente>
        </classe>`;

        // Conversione della stringa in un documento XML utilizzabile dal DOM
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");

        // Lettura degli elementi XML
        const studenti = xmlDoc.getElementsByTagName("studente");
        let tabella = "<table border='1'><tr><th>Nome</th><th>Cognome</th><th>Età</th></tr>";

        // Estrazione dei dati e costruzione delle righe HTML
        for (let i = 0; i < studenti.length; i++) {
            let nome = studenti[i].getElementsByTagName("nome")[0].textContent;
            let cognome = studenti[i].getElementsByTagName("cognome")[0].textContent;
            let eta = studenti[i].getElementsByTagName("eta")[0].textContent;

            tabella += "<tr><td>" + nome + "</td><td>" + cognome + "</td><td>" + eta + "</td></tr>";
        }

        tabella += "</table>";

        // Inserimento della tabella nella pagina
        document.getElementById("risultato").innerHTML = tabella;
    </script>

</body>
</html>
